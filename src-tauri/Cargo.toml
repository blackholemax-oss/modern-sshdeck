[package]
name = "modern-sshdeck"
version = "0.1.0"
description = "Cross-platform SSH terminal, port forwarding and LLM ops agent"
authors = ["modern-sshdeck"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "modern_sshdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = { version = "0.22", features = ["std"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
russh = { version = "0.54", default-features = false, features = ["ring", "rsa"] }
dirs = "6"
rand = "0.9"
russh-sftp = "3.0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

# 诊断用：关掉 LTO，编译快很多（不影响发布配置）
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false
panic = "unwind"
